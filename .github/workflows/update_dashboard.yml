name: Update Dashboard Daily

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run updater
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fetch_and_update.py
      - name: Push dashboard
        run: |
          git config user.name "bot"
          git config user.email "bot@mybedroom.travel"
          git add docs/
          git diff --staged --quiet || git commit -m "Auto update $(date '+%Y-%m-%d')" && git push
